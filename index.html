<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Portfolio | Software Quality Engineer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===================== RESET ===================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:'Montserrat','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

/* ===================== VARIABLES ===================== */
:root{
  --primary:#6366f1;
  --primary-dark:#4f46e5;
  --primary-light:#818cf8;
  --accent:#f59e0b;
  --secondary:#0f172a;
  --text:#334155;
  --bg:#f8fafc;
  --success:#10b981;
  --border:#e2e8f0;
}

/* ===================== BASE ===================== */
body{
  background:
    radial-gradient(at 40% 20%, rgba(99,102,241,.1), transparent 50%),
    radial-gradient(at 80% 0%, rgba(245,158,11,.1), transparent 50%),
    radial-gradient(at 0% 50%, rgba(99,102,241,.1), transparent 50%);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.6;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:0 20px;
}

section{
  padding:80px 0;
}

h1,h2,h3{
  color:var(--secondary);
}

/* ===================== BUTTON ===================== */
.btn{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:12px 28px;
  border-radius:8px;
  text-decoration:none;
  font-weight:600;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 16px var(--primary),0 0 32px var(--accent);
}
.btn::after{
  content:'';
  position:absolute;
  top:0; left:-75%;
  width:50%; height:100%;
  background:linear-gradient(120deg,rgba(255,255,255,.2),rgba(255,255,255,.6));
  transform:skewX(-25deg);
  transition:.5s;
}
.btn:hover::after{ left:120%; }

/* ===================== HEADER ===================== */
header{
  position:fixed;
  top:0; width:100%;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.2);
}
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 0;
}
.logo{
  font-size:24px;
  font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  -webkit-background-clip:text;
  color:transparent;
}
.nav-links{
  display:flex;
  list-style:none;
}
.nav-links li{ margin-left:30px; }
.nav-links a{
  text-decoration:none;
  color:var(--text);
  font-weight:500;
  position:relative;
}
.nav-links a::after{
  content:'';
  position:absolute;
  width:0; height:2px;
  background:var(--primary);
  left:0; bottom:-4px;
  transition:.3s;
}
.nav-links a:hover::after{ width:100%; }
.mobile-menu{ display:none; font-size:24px; }

/* ===================== HERO ===================== */
.hero{
  padding:180px 0 150px;
  text-align:center;
  color:#fff;
  background:linear-gradient(270deg,#6366f1,#f59e0b,#818cf8,#4f46e5);
  background-size:800% 800%;
  animation:gradientBG 18s ease infinite;
  position:relative;
}
@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.profile-img{
  width:400px;
  height:400px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid rgba(255,255,255,.3);
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}
.hero h1{
  font-size:52px;
  color:#fff;
}
.hero p{
  font-size:22px;
  margin:20px auto 40px;
}

/* ===================== ABOUT ===================== */
.about{ background:#fff; }

/* ===================== SKILLS ===================== */
.skills{
  background:linear-gradient(135deg,#f8fafc 60%,#e0e7ff);
}
.skills-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:36px;
  max-width:900px;
  margin:auto;
}
.skill-card{
  width:130px;
  height:130px;
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(8px);
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1.5px solid rgba(99,102,241,.18);
  box-shadow:0 8px 32px rgba(99,102,241,.12);
  animation:float 4s ease-in-out infinite;
}
.skill-card:hover{
  transform:translateY(-10px) scale(1.07) rotate(-2deg);
}
.skill-card i{
  font-size:38px;
  color:var(--primary);
}

/* ===================== CONTACT ===================== */
.contact{
  background:#f8fafc;
  text-align:center;
}
.contact-info{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}
.contact-item{
  background:#fff;
  padding:30px;
  border-radius:16px;
  width:220px;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
}
.contact-item i{
  font-size:32px;
  color:var(--primary);
}

/* ===================== FOOTER ===================== */
footer{
  background:linear-gradient(135deg,var(--secondary),#1a365d);
  color:#fff;
  text-align:center;
  padding:50px 0;
}
.social-links{
  display:flex;
  justify-content:center;
  gap:25px;
}

/* ===================== ANIMATIONS ===================== */
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}
.animate-float{ animation:float 5s ease-in-out infinite; }
.animate-pulse{
  animation:pulse 3s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* ===================== RESPONSIVE ===================== */
@media(max-width:768px){
  .nav-links{ display:none; flex-direction:column; background:#fff; position:absolute; top:70px; left:0; width:100%; }
  .nav-links.active{ display:flex; }
  .mobile-menu{ display:block; }
  .hero h1{ font-size:36px; }
  .profile-img{ width:280px; height:280px; }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <div class="logo">Portfolio</div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="mobile-menu"><i class="fas fa-bars"></i></div>
    </nav>
  </div>
</header>

<section id="home" class="hero">
  <div class="container">
    <img class="profile-img animate-float"
     src="https://raw.githubusercontent.com/rohitpunekar242/rohitpunekar242/c742725edbec09ef2ee846c18679cfc3ed0aae89/Image.png">
    <h1>Rohit Punekar</h1>
    <p>Software Quality Engineer <span class="typing-text"></span></p>
    <a href="#contact" class="btn">Get In Touch</a>
  </div>
</section>

<section id="skills" class="skills">
  <div class="container">
    <h2 style="text-align:center;color:var(--accent);margin-bottom:40px;">Skills</h2>
    <div class="skills-container">
      <div class="skill-card"><i class="fas fa-project-diagram"></i><h3>Selenium</h3></div>
      <div class="skill-card"><i class="fas fa-stream"></i><h3>Rest Assured</h3></div>
      <div class="skill-card"><i class="fab fa-java"></i><h3>Java</h3></div>
      <div class="skill-card"><i class="fas fa-paper-plane"></i><h3>Postman</h3></div>
      <div class="skill-card"><i class="fab fa-jira"></i><h3>Jira</h3></div>
    </div>
  </div>
</section>

<section id="contact" class="contact">
  <div class="container">
    <h2>Get In Touch</h2>
    <div class="contact-info">
      <div class="contact-item"><i class="fas fa-envelope"></i><p>punekar435@gmail.com</p></div>
      <div class="contact-item"><i class="fab fa-linkedin"></i><p>LinkedIn</p></div>
      <div class="contact-item"><i class="fas fa-map-marker-alt"></i><p>Pune, India</p></div>
    </div>
  </div>
</section>

<footer>
  <div class="social-links">
    <a href="#"><i class="fab fa-linkedin"></i></a>
    <a href="#"><i class="fab fa-github"></i></a>
  </div>
  <p>© <span id="year"></span> Rohit Punekar</p>
</footer>

<script>
document.getElementById("year").textContent=new Date().getFullYear();

/* Mobile menu */
document.querySelector('.mobile-menu').onclick=()=>{
  document.querySelector('.nav-links').classList.toggle('active');
};

/* Typing Effect */
const words=["| Passionate & Problem Solver","| Detail-Oriented","|"];
let i=0,j=0,del=false;
const el=document.querySelector('.typing-text');
function type(){
  el.textContent=words[i].substring(0,j);
  if(!del && j++===words[i].length){ del=true; }
  if(del && j--===0){ del=false;i=(i+1)%words.length; }
  setTimeout(type,del?60:120);
}
type();
</script>

</body>
</html>
